title: "PythonでPyxelをかじる本(導入編)"
summary: "
Pythonのゲーム専用エンジン「Pyxel」を導入する手順書です。
スプライト管理やマウスの左ボタン入力、衝突判定といった基本要素を、
Pythonの基礎的なコードだけで少しずつ作っていきます。
尚、この連載では'とりあえず動く'ことを優先させております。
詳細については公式サイトをご参照ください。
(執筆時点でのバージョンはv2.5.11です)"
